# Simplified keyword list prevents GDELT backend timeout errors
hazard_terms: >-
  (haze OR smog OR jerebu OR karhutla OR "forest fire" OR wildfire)

regions:
  Indonesia: "Indonesia"
  Malaysia: "Malaysia"
  Singapore_Brunei: "(Singapore OR Brunei)"
  Thailand_Laos_Myanmar: "(Thailand OR Laos OR Myanmar)"
  Vietnam_Cambodia: "(Vietnam OR Cambodia)"
  Philippines: "Philippines"

gdelt_settings:
  max_records: 250
  sort: "datedesc"
  timespan: "30d"
  request_delay: 3.5  # Pause duration (in seconds) between network requests
