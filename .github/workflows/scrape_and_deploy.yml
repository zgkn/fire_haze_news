name: Update Fire & Haze News Data

on:
  schedule:
    # Runs every 2 hours at offset minutes 3 and 33
    - cron: '3,33 */2 * * *'
  workflow_dispatch:      # Allows manual triggers from GitHub UI
  push:
    branches:
      - main
    paths-ignore:
      - 'config.yaml'
      - 'docs/**'
      - '**.md'

# Prevents concurrent runs by canceling older in-progress builds when a new one triggers
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run GDELT Ingestion Script
        run: python scripts/fetch_data.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/sea_fire_haze_news_30d.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update GDELT news feed [skip ci]" && git push origin main)
