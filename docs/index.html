<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Southeast Asia Fire & Haze News Tracker</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --primary: #d97706;
      --primary-hover: #b45309;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.5; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    
    header { margin-bottom: 24px; }
    h1 { font-size: 1.75rem; color: var(--text-main); margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    p.subtitle { color: var(--text-muted); font-size: 0.95rem; }

    /* Controls Bar */
    .controls { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; margin-bottom: 20px; background: var(--card-bg); padding: 16px; border-radius: var(--radius); border: 1px solid var(--border-color); }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: var(--radius); font-size: 0.9rem; outline: none; background-color: #fff; }
    input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(217, 119, 6, 0.15); }

    /* Metrics Bar */
    .metrics { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }

    /* Table & Responsive Container */
    .table-container { background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border-color); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th, td { padding: 12px 16px; border-bottom: 1px solid var(--border-color); }
    th { background-color: #f1f5f9; color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
    tr:last-child td { border-bottom: none; }
    tr:hover { background-color: #f8fafc; }

    /* Tags & Components */
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; background-color: #fef3c7; color: #92400e; }
    a.article-link { color: var(--primary); text-decoration: none; font-weight: 500; }
    a.article-link:hover { text-decoration: underline; color: var(--primary-hover); }
    .domain-tag { font-size: 0.8rem; color: var(--text-muted); display: block; margin-top: 2px; }

    /* States */
    .status-msg { padding: 40px; text-align: center; color: var(--text-muted); font-size: 0.95rem; }

    /* Mobile Layout Adjustments */
    @media (max-width: 768px) {
      .controls { grid-template-columns: 1fr; }
      th:nth-child(4), td:nth-child(4) { display: none; } /* Hide Language on small screens */
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🔥 SEA Fire & Haze Tracker</h1>
      <p class="subtitle">Aggregated near real-time media coverage over the last 30 days via GDELT.</p>
    </header>

    <!-- Filter Controls -->
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search by title or domain..." oninput="filterData()">
      
      <select id="regionSelect" onchange="filterData()">
        <option value="">All Regions</option>
      </select>

      <select id="sortSelect" onchange="filterData()">
        <option value="newest">Sort: Newest First</option>
        <option value="oldest">Sort: Oldest First</option>
      </select>
    </div>

    <!-- Metrics -->
    <div class="metrics">
      <span id="recordCount">Loading records...</span>
      <span id="lastUpdated"></span>
    </div>

    <!-- Data Table -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th style="width: 140px;">Date (UTC)</th>
            <th style="width: 160px;">Region</th>
            <th>Article Title & Domain</th>
            <th style="width: 100px;">Language</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="4" class="status-msg">Fetching dataset...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let rawData = [];

    // Fetch static JSON produced by Python script
    async function loadData() {
      try {
        const response = await fetch('data.json');
        if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
        rawData = await response.json();
        
        populateRegionFilter(rawData);
        filterData();
      } catch (err) {
        document.getElementById('tableBody').innerHTML = `
          <tr><td colspan="4" class="status-msg" style="color:#ef4444;">
            Failed to load <code>docs/data.json</code>. Verify that GitHub Actions has run and generated the file.
          </td></tr>`;
        document.getElementById('recordCount').innerText = "0 records found";
      }
    }

    // Populate dynamic Region options based on actual dataset values
    function populateRegionFilter(data) {
      const regionSelect = document.getElementById('regionSelect');
      const regions = [...new Set(data.map(item => item.matched_region).filter(Boolean))].sort();
      
      regions.forEach(region => {
        const option = document.createElement('option');
        option.value = region;
        option.textContent = region.replace(/_/g, ' ');
        regionSelect.appendChild(option);
      });
    }

    // Filter, Sort, and Render UI
    function filterData() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const selectedRegion = document.getElementById('regionSelect').value;
      const sortOrder = document.getElementById('sortSelect').value;

      // 1. Filter
      let filtered = rawData.filter(item => {
        const matchesSearch = (item.title && item.title.toLowerCase().includes(searchTerm)) ||
                              (item.domain && item.domain.toLowerCase().includes(searchTerm));
        const matchesRegion = !selectedRegion || item.matched_region === selectedRegion;
        return matchesSearch && matchesRegion;
      });

      // 2. Sort
      filtered.sort((a, b) => {
        const dateA = new Date(a.seen_date || 0);
        const dateB = new Date(b.seen_date || 0);
        return sortOrder === 'newest' ? dateB - dateA : dateA - dateB;
      });

      // 3. Render
      renderTable(filtered);
    }

    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      const recordCount = document.getElementById('recordCount');

      recordCount.innerText = `Showing ${data.length.toLocaleString()} of ${rawData.length.toLocaleString()} articles`;

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="status-msg">No matching articles found.</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(item => {
        const formattedDate = item.seen_date 
          ? new Date(item.seen_date).toISOString().replace('T', ' ').substring(0, 16)
          : 'N/A';

        const regionDisplay = (item.matched_region || 'Unknown').replace(/_/g, ' ');

        return `
          <tr>
            <td style="white-space: nowrap; color: var(--text-muted);">${formattedDate}</td>
            <td><span class="badge">${escapeHtml(regionDisplay)}</span></td>
            <td>
              <a class="article-link" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">
                ${escapeHtml(item.title || 'Untitled Article')}
              </a>
              <span class="domain-tag">${escapeHtml(item.domain || '')}</span>
            </td>
            <td style="text-transform: uppercase; color: var(--text-muted);">${escapeHtml(item.language || 'eng')}</td>
          </tr>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, match => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[match]));
    }

    // Initial trigger on load
    document.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
